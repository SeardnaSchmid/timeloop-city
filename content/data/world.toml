#:schema ../schema/world.schema.json
# Bread town: field -> mill -> bakery. All values are integers; needs use a 0-1000 scale.

[world]
agents = 50
start_money = 200

[goods]
names = ["grain", "flour", "bread"]
food = "bread"

[[business]]
name = "field"
output = "grain"
output_milli_per_worker_hour = 750
slots = 22
cash = 3000
price = 15
wage = 10
stock = 200
output_target = 100

[[business]]
name = "mill"
output = "flour"
input = { good = "grain", amount = 1 }
output_milli_per_worker_hour = 1500
slots = 12
cash = 3000
price = 25
wage = 10
stock = 200
output_target = 100
input_target = 200

[[business]]
name = "bakery"
output = "bread"
input = { good = "flour", amount = 1 }
output_milli_per_worker_hour = 1500
slots = 12
cash = 3000
price = 35
wage = 10
stock = 150
output_target = 100
input_target = 200

[market]
price_step = 1
price_min = 1
wage_step = 1
wage_min = 5
reserve_days = 3

[needs.hunger]
per_hour = 40
eat_at = 300
# Interrupts the current action to go eat.
critical = 800

[needs.fatigue]
per_hour = 40
# Sleep at any hour from here on; at night agents already sleep from 200.
sleep_at = 700
recovery_per_hour = 80

[meal]
relief = 300
minutes = 30

[work]
start_hour = 8
end_hour = 18

[wander]
min_minutes = 30
max_minutes = 120
