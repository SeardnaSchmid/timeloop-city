#:schema ../schema/world.schema.json
# Bread town: field -> mill -> bakery. All values are integers; needs use a 0-1000 scale.

[world]
agents = 50
start_money = 200

[goods]
names = ["grain", "flour", "bread"]
food = "bread"

[[business]]
name = "field"
output = "grain"
output_milli_per_worker_hour = 750
slots = 22
cash = 3000
price = 15
wage = 10
stock = 200
output_target = 100

[[business]]
name = "mill"
output = "flour"
input = { good = "grain", amount = 1 }
output_milli_per_worker_hour = 1500
slots = 12
cash = 3000
price = 25
wage = 10
stock = 200
output_target = 100
input_target = 200

[[business]]
name = "bakery"
output = "bread"
input = { good = "flour", amount = 1 }
output_milli_per_worker_hour = 1500
slots = 12
cash = 3000
price = 35
wage = 10
stock = 150
output_target = 100
input_target = 200

[market]
price_step = 1
price_min = 1
wage_step = 1
wage_min = 5
reserve_days = 3

[traits]
# Character traits, 0-1000. Formulas read them as trait.<name>.
# greed: money matters more than free time. work_life: free time and rest matter more.
names = ["greed", "work_life"]

[[population]]
name = "townsfolk"
weight = 1
traits = { greed = [0, 1000], work_life = [0, 1000] }

[needs.hunger]
per_hour = 40
# Interrupts the current action to go eat.
critical = 800

[needs.fatigue]
per_hour = 40
recovery_per_hour = 80

# Safety: 1000 without savings, 0 once savings pay for reserve_days of meals.
[needs.safety]
reserve_days = 5
meals_per_day = 3

[meal]
relief = 300
minutes = 30

[work]
start_hour = 8
end_hour = 18
overtime_end_hour = 21
block_minutes = 120

[wander]
min_minutes = 30
max_minutes = 120

# Decision rules. On every wake-up each allowed action is scored and the
# highest wins. Weights follow the needs pyramid: hunger (x4) and sleep (x3)
# are level 1 and beat safety (level 2, x1/2) and the traits.

[action.eat]
when = "need.hunger >= 300"
score = "4 * need.hunger"

[action.sleep]
when = "need.fatigue >= 700 || (night && need.fatigue >= 200)"
score = "3 * need.fatigue"

[action.work]
score = "400 + need.safety / 2 + trait.greed / 4 - need.fatigue * trait.work_life / 1000"

[action.overtime]
score = "need.safety / 2 + trait.greed / 2 - need.fatigue * trait.work_life / 1000"

[action.wander]
score = "300 + trait.work_life / 4"
