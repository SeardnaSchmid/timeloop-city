#:schema ../schema/world.schema.json
# A small town: food, building materials, drink, wood, clay, textiles, dairy, glass. All values are integers; needs use a 0-1000 scale.

[world]
agents = 100
start_money = 200

[goods]
# Raw goods (grain, wood, stone, clay, wool, milk, sand) come from the land;
# everything else is made from one input. Bread is food; the rest covers
# comfort or is building material.
names = [
  "grain", "flour", "bread", "beer",
  "wood", "planks", "furniture",
  "stone", "clay", "bricks", "pottery",
  "wool", "yarn", "cloth", "clothes",
  "milk", "cheese",
  "sand", "glassware",
]
food = "bread"

# What a unit satisfies. Nobody makes these at the start.
[goods.satisfies]
beer = { comfort = 250 }
furniture = { comfort = 600 }
clothes = { comfort = 500 }
cheese = { comfort = 200 }
pottery = { comfort = 300 }
glassware = { comfort = 250 }

# --- Food chain (town): field -> mill -> bakery ---

[[business]]
name = "field"
x = 3
y = 4
output = "grain"
output_milli_per_worker_hour = 1250
slots = 22
cash = 3000
price = 15
wage = 10
stock = 200
output_target = 100

[[business]]
name = "mill"
x = 12
y = 4
output = "flour"
input = { good = "grain", amount = 1 }
output_milli_per_worker_hour = 2000
slots = 12
cash = 3000
price = 25
wage = 10
stock = 200
output_target = 100
input_target = 200

[[business]]
name = "bakery"
x = 20
y = 12
output = "bread"
input = { good = "flour", amount = 1 }
output_milli_per_worker_hour = 2000
slots = 12
cash = 3000
price = 35
wage = 10
stock = 150
output_target = 100
input_target = 200

