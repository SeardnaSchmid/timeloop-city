[market]
price_change_percent = 5
price_min = 1
wage_step = 1
wage_min = 5
reserve_days = 3

[map]
width = 24
height = 18
travel_minutes_per_parcel = 2
land_price_base = 100
land_price_radius = 5

# 60 beds for 50 agents, some near each workplace, some cheap far out.
[[house]]
name = "farmstead"
x = 2
y = 6
beds = 12
rent = 5

[[house]]
name = "mill row"
x = 13
y = 2
beds = 12
rent = 5

[[house]]
name = "bakers lane"
x = 21
y = 14
beds = 12
rent = 5

[[house]]
name = "market court"
x = 11
y = 9
beds = 12
rent = 5

[[house]]
name = "outskirts"
x = 1
y = 17
beds = 12
rent = 5

[housing]
rent_step = 1
rent_min = 1
homeless_recovery_percent = 50
# Rent for two days in hand; cheap and close beats dear and far; moving
# needs a real gain.
when = "money >= house.rent * 2"
score = "400 - house.rent * 10 - house.distance * 15 + house.current * 30"
homeless_score = "0"

# Associations meet weekly: collect dues, pay out their treasury, decide
# their rules (formulas over market.price, market.cost, market.shortage,
# market.firms, assoc.cash, assoc.members, day).
# The bakers' guild keeps bread from being sold below cost plus three quarters,
# takes 5% of its members' sales and charges for opening a new bakery; its
# treasury goes back to the bakeries.
[[association]]
name = "bakers guild"
goods = ["bread"]
rules = { min_price = "market.cost * 175 / 100", dues_percent = "5", founding_fee = "200" }

# The town council: 5% on every meal, paid out as welfare.
[[association]]
name = "town council"
rules = { sales_tax_percent = "5" }

[traits]
# Character traits, 0-1000. Formulas read them as trait.<name>.
# greed: money matters more than free time. work_life: free time and rest matter more.
names = ["greed", "work_life"]

[[population]]
name = "townsfolk"
weight = 1
traits = { greed = [0, 1000], work_life = [0, 1000] }

# Life course. The town keeps 50 people: whoever dies is replaced the same
# day by a child of someone aged 20-50 (70%) or a newcomer, entering at 16
# with no money. Children inherit money and firm.
[life]
start_age = [16, 70]
entry_age = 16
education_end_age = 18
retirement_age = 65
lifespan = [70, 90]
birth_percent = 70
parent_age = [20, 50]
# Share of every wage that pays for pensions and education allowances.
pension_percent = 20
# Share of an estate that goes to the town's welfare; children share the rest.
inheritance_tax_percent = 50

# Professions (one per kind of business) with levels, as in Ages of Echo:
# 1 experience per hour worked, 50 for level 1, each level 6% more; every
# level adds 2% output and 2% wage.
[career]
xp_per_hour = 1
level_xp_base = 50
level_xp_growth_percent = 6
output_per_level_permille = 20
wage_per_level_permille = 20
max_level = 100

# Houses. Someone with the cost in cash builds when full houses turn people away
# and few beds are free; rent goes to the builder (after the profit tax).
# cost is land and labour; the materials are bought on the market on top.
[building]
cost = 400
materials = { planks = 12, bricks = 16, stone = 6 }
beds = 8
rent = 5
construction_days = 30
max_houses = 20
when = "money >= building.cost + 200 && housing.wanted > 0 && housing.free_beds < 4"
score = "money + housing.rent * 50"

# Work nobody takes draws newcomers (working age, no money), up to 3x the start population.
[growth]
max_agents = 300
arrivals_per_day = 1

[needs.hunger]
per_hour = 40
# Interrupts the current action to go eat.
critical = 800

[needs.fatigue]
per_hour = 40
recovery_per_hour = 80
max_sleep_minutes = 600

# Safety: 1000 without savings, 0 once savings pay for reserve_days of meals.
[needs.safety]
reserve_days = 5
meals_per_day = 3

# Comfort, above safety: grows over the day; from buy_at on, agents with
# savings beyond the safety reserve buy what satisfies it, paying for one
# unit up to 4% of those savings at buy_at, more as the need grows.
[needs.comfort]
per_hour = 15
buy_at = 300
spend_permille = 40

[meal]
relief = 300
minutes = 30

[work]
start_hour = 8
end_hour = 18
overtime_end_hour = 21
block_minutes = 120

[wander]
min_minutes = 30
max_minutes = 120

# Decision rules. On every wake-up each allowed action is scored and the
# highest wins. Weights follow the needs pyramid: hunger (x4) and sleep (x3)
# are level 1 and beat safety (level 2, x1/2) and the traits.

[action.eat]
when = "need.hunger >= 300"
score = "4 * need.hunger"

[action.sleep]
when = "need.fatigue >= 700 || (night && need.fatigue >= 200)"
score = "3 * need.fatigue"

[action.work]
score = "400 + need.safety / 2 + trait.greed / 4 - need.fatigue * trait.work_life / 1000"

[action.overtime]
score = "need.safety / 2 + trait.greed / 2 - need.fatigue * trait.work_life / 1000"

[action.wander]
score = "300 + trait.work_life / 4"

# Firms. A founder needs the capital in cash and, by default, a good that
# ran short lately and sells well above what it costs to make.
[founding]
capital = 300
# A workshop: bought on the market on top of the capital.
materials = { planks = 4, bricks = 6 }
profit_tax_percent = 75
max_firms = 30
when = "owns_firm < 3 && money >= firm.capital + 100 && market.newest_days >= 365 && market.price * 100 >= market.cost * 150 && (market.firms > 0 || market.shortage > 0)"
score = "(market.price - market.cost) * 1000 / max(market.cost, 1) + market.shortage + trait.greed / 2"
# Broke for a month: give up. Town businesses follow the same rule.
close = "firm.broke_days >= 30"
